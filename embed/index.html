<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>God’s Earth View · Dream Unity prototype</title><meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="stylesheet" href="/style.css" />

    <style>
      /* Hide the full interface before first paint, even while CSS loads. */
      #du-embed-waiting[hidden],
      #du-application[hidden],
      #du-welcome [hidden],
      #du-welcome[hidden] {
        display: none !important;
      }
      #du-application {
        display: contents;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=adjust,arrow_drop_down,arrow_forward,arrow_left,arrow_right,bolt,chevron_left,chevron_right,close,close_fullscreen,dark_mode,draw,east,flare,flight,layers_clear,light_mode,local_fire_department,my_location,navigation,normal,on,open_in_full,public,radar,radio,right_panel_close,right_panel_open,rocket_launch,skip_next,skip_previous,view_in_ar"
      rel="stylesheet"
    />
</head><body>

<h1 id="du-embed-title">God’s Earth View</h1><p id="du-embed-status" role="status">Waiting for Dream Unity…</p><a href="/" target="_blank" rel="noopener noreferrer" style="color:#a8dbea">Open the complete standalone view</a>
<noscript><p>JavaScript is required for the interactive globe.</p></noscript></main>
